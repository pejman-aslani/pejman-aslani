<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" fill="none">
  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#8b5cf6;#06b6d4;#0ea5e9" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#0ea5e9;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect x="20" y="20" width="840" height="380" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes scanline { 0%{transform:translateY(-400px)} 100%{transform:translateY(400px)} }
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code','Consolas',monospace; }
    .c-key   { fill: #c084fc; }
    .c-fn    { fill: #67e8f9; }
    .c-str   { fill: #86efac; }
    .c-type  { fill: #fbbf24; }
    .c-comm  { fill: #475569; font-style: italic; }
    .c-plain { fill: #cbd5e1; }
    .c-num   { fill: #fb923c; }
    .c-op    { fill: #94a3b8; }
    .cursor  { fill: #67e8f9; animation: blink 1.1s step-end infinite; }
  </style>

  <!-- outer glow border -->
  <rect x="18" y="18" width="844" height="384" rx="14" stroke="url(#border)" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.5"/>

  <!-- main frame -->
  <rect x="20" y="20" width="840" height="380" rx="12" fill="#0c0e14" stroke="url(#border)" stroke-width="1.5"/>

  <!-- subtle scanline effect -->
  <g clip-path="url(#roundClip)" opacity="0.03">
    <rect x="20" y="20" width="840" height="6" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0 -10;0 400" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title bar -->
  <rect x="20" y="20" width="840" height="38" rx="12" fill="#12151e"/>
  <rect x="20" y="46" width="840" height="12" fill="#12151e"/>

  <!-- window controls -->
  <circle cx="42" cy="39" r="5.5" fill="#3b3f51" stroke="#555a6e" stroke-width="0.5"/>
  <circle cx="60" cy="39" r="5.5" fill="#3b3f51" stroke="#555a6e" stroke-width="0.5"/>
  <circle cx="78" cy="39" r="5.5" fill="#3b3f51" stroke="#555a6e" stroke-width="0.5"/>

  <!-- title -->
  <text x="440" y="43.5" text-anchor="middle" class="mono" font-size="11" fill="#475569">pejman@arch — ~/src/core/SystemArchitect.php</text>

  <!-- separator line -->
  <line x1="20" y1="58" x2="860" y2="58" stroke="#1e2130" stroke-width="1"/>

  <!-- line numbers gutter -->
  <g class="mono" font-size="12.5" fill="#2d3348">
    <text x="38" y="86">1</text>
    <text x="38" y="108">2</text>
    <text x="38" y="130">3</text>
    <text x="38" y="152">4</text>
    <text x="38" y="174">5</text>
    <text x="38" y="196">6</text>
    <text x="38" y="218">7</text>
    <text x="38" y="240">8</text>
    <text x="38" y="262">9</text>
    <text x="32" y="284">10</text>
    <text x="32" y="306">11</text>
    <text x="32" y="328">12</text>
    <text x="32" y="350">13</text>
    <text x="32" y="372">14</text>
  </g>

  <!-- gutter separator -->
  <line x1="56" y1="58" x2="56" y2="400" stroke="#1a1d2e" stroke-width="1"/>

  <!-- code content -->
  <g class="mono" font-size="12.5" transform="translate(68, 0)">

    <text y="86"><tspan class="c-key">&lt;?php</tspan> <tspan class="c-key">declare</tspan><tspan class="c-op">(</tspan><tspan class="c-plain">strict_types</tspan><tspan class="c-op">=</tspan><tspan class="c-num">1</tspan><tspan class="c-op">);</tspan></text>

    <text y="108" class="c-comm">// Production Architecture — Pejman Aslani</text>

    <text y="130"><tspan class="c-key">final readonly class</tspan> <tspan class="c-type">SystemArchitect</tspan></text>

    <text y="152"><tspan class="c-op">{</tspan></text>

    <text y="174"><tspan class="c-plain">    </tspan><tspan class="c-key">public function</tspan> <tspan class="c-fn">__construct</tspan><tspan class="c-op">(</tspan></text>

    <text y="196"><tspan class="c-plain">        </tspan><tspan class="c-key">private</tspan> <tspan class="c-type">Stack</tspan>    <tspan class="c-plain">$backend</tspan>  <tspan class="c-op">=</tspan> <tspan class="c-str">'PHP 8.3 · Laravel · Yii2'</tspan><tspan class="c-op">,</tspan></text>

    <text y="218"><tspan class="c-plain">        </tspan><tspan class="c-key">private</tspan> <tspan class="c-type">Infra</tspan>    <tspan class="c-plain">$platform</tspan> <tspan class="c-op">=</tspan> <tspan class="c-str">'Docker · K8s · GitLab CI'</tspan><tspan class="c-op">,</tspan></text>

    <text y="240"><tspan class="c-plain">        </tspan><tspan class="c-key">private</tspan> <tspan class="c-type">DataLayer</tspan> <tspan class="c-plain">$storage</tspan>  <tspan class="c-op">=</tspan> <tspan class="c-str">'Postgres · Redis · Elastic'</tspan><tspan class="c-op">,</tspan></text>

    <text y="262"><tspan class="c-plain">        </tspan><tspan class="c-key">private</tspan> <tspan class="c-type">Pattern</tspan>  <tspan class="c-plain">$design</tspan>   <tspan class="c-op">=</tspan> <tspan class="c-str">'DDD · CQRS · Event Sourcing'</tspan><tspan class="c-op">,</tspan></text>

    <text y="284"><tspan class="c-plain">    </tspan><tspan class="c-op">) {}</tspan></text>

    <text y="306" class="c-plain"></text>

    <text y="328"><tspan class="c-plain">    </tspan><tspan class="c-key">public function</tspan> <tspan class="c-fn">deploy</tspan><tspan class="c-op">():</tspan> <tspan class="c-type">HighAvailability</tspan> <tspan class="c-op">{</tspan> <tspan class="c-comm">/* ship it */</tspan> <tspan class="c-op">}</tspan></text>

    <text y="350"><tspan class="c-op">}</tspan></text>

    <!-- blinking cursor -->
    <rect x="0" y="359" width="7.5" height="15" rx="1" class="cursor"/>
  </g>

  <!-- bottom status bar -->
  <rect x="20" y="388" width="840" height="12" rx="0" fill="#12151e"/>
  <text x="34" y="397" class="mono" font-size="9" fill="#334155">PHP 8.3</text>
  <text x="110" y="397" class="mono" font-size="9" fill="#334155">UTF-8</text>
  <text x="830" y="397" class="mono" font-size="9" fill="#334155" text-anchor="end">production</text>
</svg>
